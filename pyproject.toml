[project]
name = "tfg-mcp-x402"
version = "0.1.0"
description = "Reproducible local prototype for MCP and x402 interoperability."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115,<1.0",
    "uvicorn[standard]>=0.30,<1.0",
]

[dependency-groups]
dev = [
    "httpx>=0.27,<1.0",
    "pytest>=8.0,<9.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/tfg_mcp_x402"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]

